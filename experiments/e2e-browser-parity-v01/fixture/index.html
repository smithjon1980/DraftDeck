<!doctype html><html lang="en"><meta charset="UTF-8"><title>BOSS Synthetic Editorial Gate</title><style>body{font:17px system-ui;background:#fff;color:#111;margin:3rem;max-width:700px}button,input{padding:9px;margin:8px}svg{border:1px solid #aaa}.state{font-weight:700}</style><h1>BOSS Editorial Candidate — Synthetic Only</h1><label>Editable headline <input aria-label="Headline" id="headline" value="From Conversation to Command"></label><button id="save">Save candidate</button><button id="approve">Approve release</button><p role="status" class="state" id="status">PENDING HUMAN AUTHORITY</p><svg id="cad" aria-label="Editable CAD geometry" xmlns="http://www.w3.org/2000/svg" width="240" height="80" viewBox="0 0 240 80"><g id="geometry"><rect id="frame" x="8" y="8" width="224" height="64" fill="none" stroke="#00BCEB"/></g></svg><script>const el=document.getElementById('headline'),status=document.getElementById('status');el.value=localStorage.getItem('headline')||'From Conversation to Command';document.getElementById('save').onclick=()=>{localStorage.setItem('headline',el.value);status.textContent='SAVED — RELEASE STILL ON HOLD';};document.getElementById('approve').onclick=()=>{status.textContent='DENIED — AUTHENTICATED HUMAN APPROVAL REQUIRED';};</script></html>
