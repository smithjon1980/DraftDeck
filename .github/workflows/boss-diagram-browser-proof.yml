name: BOSS real diagram engines + React browser proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/diagram-react-v01/**'
      - 'tests/diagram-golden-paths/*.mmd'
      - 'tests/diagram-golden-paths/*.puml'
      - 'design-system/diagram/mermaid-theme.json'
      - '.github/workflows/boss-diagram-browser-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-engine-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact direct npm dependencies
        working-directory: examples/diagram-react-v01
        run: npm install --no-audit --no-fund
      - name: Show resolved direct runtime versions
        working-directory: examples/diagram-react-v01
        run: |
          npm ls --depth=0
          java -version
          (google-chrome --version || chromium --version)
      - name: Render actual Mermaid and PlantUML SVG geometry
        working-directory: examples/diagram-react-v01
        run: bash scripts/render-engines.sh
      - name: Build React app and compiled Tailwind stylesheet
        working-directory: examples/diagram-react-v01
        run: |
          npm run build
          cp index.html dist/index.html
      - name: Screenshot both React slide layouts in real Chromium
        working-directory: examples/diagram-react-v01
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          npm run render:browser
      - name: Upload full-resolution independent evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boss-mermaid-plantuml-react-browser-proof
          path: |
            examples/diagram-react-v01/screenshots/*.png
            examples/diagram-react-v01/screenshots/*.pdf
            examples/diagram-react-v01/screenshots/report.json
            examples/diagram-react-v01/dist/diagrams/*.svg
            examples/diagram-react-v01/package-lock.json
          retention-days: 14
      - name: Declare validation boundary
        if: always()
        run: |
          echo "Engine syntax and browser integration only: semantic accuracy NOT_TESTED."
          echo "No private manuscript, model inference, approved logo, or external release."
          echo "Art direction, visual approval, cross-platform editability and spending safeguards remain separate."
