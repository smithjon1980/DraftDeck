name: Granite Speech 5 public demo probe
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/granite-speech-demo-probe.yml'
      - 'experiments/granite-speech-5/public_space_smoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare non-sensitive public synthetic audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          espeak-ng -v en-us -s 135 -w public_original.wav "The shipping label does not prove delivery. The package requires independent inspection."
          ffmpeg -hide_banner -loglevel error -y -i public_original.wav -ar 16000 -ac 1 -sample_fmt s16 public_synthetic_16k.wav
      - name: Query public hosted demo API
        run: |
          python -m pip install -q 'gradio_client>=1,<3'
          python experiments/granite-speech-5/public_space_smoke.py
      - name: Upload synthetic-only API report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granite-speech-5-public-demo-result
          path: granite_public_space_smoke.json
          retention-days: 2
          if-no-files-found: ignore
