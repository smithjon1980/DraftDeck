name: BOSS diagram standards candidate validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'design-system/diagram-*'
      - 'design-system/prompts/diagram-model-instructions.md'
      - 'design-system/validation/check_diagram_pack.py'
      - '.github/workflows/boss-diagram-standards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-structure:
    name: Synthetic diagram contract checks (no inference)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Validate route manifest, source evidence, positive/negative fixtures
        run: python design-system/validation/check_diagram_pack.py
      - name: Explicit evidence boundary
        run: |
          echo "Model inference: NOT EXECUTED; API secret: NOT LOADED."
          echo "Diagram compilation and React browser visual comparison: NOT TESTED."
          echo "ISO/OMG certified conformance and human release: NOT ESTABLISHED."
