name: Granite Speech public CPU inference smoke
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/granite-speech-cpu-smoke.yml'
      - 'experiments/granite-speech-5/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: ${{ runner.temp }}/hf-public-smoke
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install -q 'transformers>=4.52.1,<6' 'accelerate>=1' 'soundfile>=0.12'
      - name: Create public synthetic non-BOSS audio
        run: |
          espeak-ng -v en-us -s 135 -w public_original.wav "The shipping label does not prove delivery. The package requires independent inspection."
          ffmpeg -hide_banner -loglevel error -y -i public_original.wav -ar 16000 -ac 1 -sample_fmt s16 public_synthetic_16k.wav
      - name: Run Granite Speech 5.0 CPU inference
        run: python experiments/granite-speech-5/public_smoke.py
      - name: Upload public result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granite-speech-5-public-smoke
          path: granite_public_smoke_results.json
          retention-days: 2
          if-no-files-found: ignore
