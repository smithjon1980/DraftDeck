name: BOSS OpenBot + OpenDots cross-governance stress (no database)
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/openbot-opendots-boundary/**'
      - '.github/workflows/boss-openbot-opendots-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  opendots_workspace:
    name: OpenDots full suite, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      CI: 'true'
      DO_NOT_TRACK: '1'
      WEB_SEARCH_PROVIDER: disabled
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch pinned OpenDots source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 https://github.com/CopilotKit/OpenDots.git upstream-opendots
          cd upstream-opendots
          git fetch --filter=blob:none --depth=1 origin 8091324942b86789ed0da7facbee855145d933b0
          git checkout --detach 8091324942b86789ed0da7facbee855145d933b0
          test "$(git rev-parse HEAD)" = 8091324942b86789ed0da7facbee855145d933b0
          echo OPENDOTS_PIN_VERIFIED
      - name: Install exact OpenDots lockfile dependencies
        working-directory: upstream-opendots
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck project
        working-directory: upstream-opendots
        run: npm run typecheck
      - name: Build real OpenDots React and server TypeScript
        working-directory: upstream-opendots
        run: npm run build
      - name: Test actual OpenDots approval, storage, computer security, worker recovery, tool and route behavior
        working-directory: upstream-opendots
        run: |
          set -o pipefail
          npm test -- \
            tests/computer-routes.test.ts tests/computer.test.ts \
            tests/security.test.ts tests/runner.test.ts \
            tests/page-review.test.tsx tests/page-routes.test.ts \
            tests/page-service.test.ts tests/page-snapshots.test.ts \
            tests/connections.test.ts tests/composio-tools.test.ts \
            tests/headless-runtime.test.ts tests/headless.test.ts \
            tests/shutdown.test.ts tests/runtime-scope.test.ts \
            tests/workspace.test.ts tests/research.test.ts \
            tests/agent-run-timeout.test.ts \
            2>&1 | tee ../opendots_boundary_test_log.txt
      - name: Save isolated test output (no external credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-opendots-boundary-test-log
          path: opendots_boundary_test_log.txt
          if-no-files-found: ignore
          retention-days: 7


  opendots_full_suite:
    name: OpenDots complete native test suite
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: 'true'
      DO_NOT_TRACK: '1'
      WEB_SEARCH_PROVIDER: disabled
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch pinned OpenDots source
        run: |
          git clone --filter=blob:none --depth=1 https://github.com/CopilotKit/OpenDots.git upstream-opendots
          cd upstream-opendots
          git fetch --filter=blob:none --depth=1 origin 8091324942b86789ed0da7facbee855145d933b0
          git checkout --detach 8091324942b86789ed0da7facbee855145d933b0
          test "$(git rev-parse HEAD)" = 8091324942b86789ed0da7facbee855145d933b0
      - name: Install pinned lockfile
        working-directory: upstream-opendots
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inject BOSS synthetic 150-request denial burst suite in disposable OpenDots checkout
        run: cp experiments/openbot-opendots-boundary/boss_opendots_permission_burst.test.ts upstream-opendots/tests/boss_opendots_permission_burst.test.ts
      - name: Run ALL OpenDots native tests (not just selected suites)
        working-directory: upstream-opendots
        run: |
          set -o pipefail
          npm test -- --maxWorkers=2 2>&1 | tee ../opendots_full_test_log.txt
      - name: Save complete suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-opendots-full-suite-log
          path: opendots_full_test_log.txt
          if-no-files-found: ignore
          retention-days: 7

  openbot_computer_security:
    name: OpenBot agent-computer adversarial tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Fetch pinned OpenBot source
        run: |
          git clone --filter=blob:none --depth=1 https://github.com/CopilotKit/OpenBot.git upstream-openbot
          cd upstream-openbot
          git fetch --filter=blob:none --depth=1 origin bd4dc94943a9d62aefd05e5e99073ba58919c9c6
          git checkout --detach bd4dc94943a9d62aefd05e5e99073ba58919c9c6
          test "$(git rev-parse HEAD)" = bd4dc94943a9d62aefd05e5e99073ba58919c9c6
      - name: Install agent computer dependencies
        working-directory: upstream-openbot/agent-computer
        run: bun install --frozen-lockfile
      - name: Exercise untrusted-input, egress and file/action barriers
        working-directory: upstream-openbot/agent-computer
        run: |
          set -o pipefail
          bun test \
            tests/action-barrier.test.ts tests/authorisation.test.ts \
            tests/egress-policy.test.ts tests/egress.test.ts \
            tests/request-validation.test.ts tests/workspace.test.ts \
            tests/control.test.ts \
            2>&1 | tee ../../openbot_computer_security_log.txt
      - name: Save computer security test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-openbot-computer-security-log
          path: openbot_computer_security_log.txt
          if-no-files-found: ignore
          retention-days: 7


  opendots_openbot_policy_spike:
    name: OpenDots -> actual OpenBot CEL policy mediation (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CI: 'true'
      DO_NOT_TRACK: '1'
      WEB_SEARCH_PROVIDER: disabled
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch pinned OpenDots checkout
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 https://github.com/CopilotKit/OpenDots.git upstream-opendots
          cd upstream-opendots
          git fetch --filter=blob:none --depth=1 origin 8091324942b86789ed0da7facbee855145d933b0
          git checkout --detach 8091324942b86789ed0da7facbee855145d933b0
          test "$(git rev-parse HEAD)" = 8091324942b86789ed0da7facbee855145d933b0
      - name: Verify exact unmodified OpenBot CEL policy source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream-opendots/boss-openbot-policy
          curl -fsSL --retry 3 https://raw.githubusercontent.com/CopilotKit/OpenBot/bd4dc94943a9d62aefd05e5e99073ba58919c9c6/server/src/computer/policy.ts -o upstream-opendots/boss-openbot-policy/policy.ts
          test "$(git hash-object upstream-opendots/boss-openbot-policy/policy.ts)" = 94bc46ad3a74bdb56ad84f86527057ecba6c735e
          cp experiments/openbot-opendots-boundary/boss_cross_policy_spike.test.ts upstream-opendots/tests/boss_cross_policy_spike.test.ts
      - name: Install OpenDots and upstream CEL library
        working-directory: upstream-opendots
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund cel-js@0.8.2
      - name: Execute synthetic BOSS mediation and bypass diagnostic
        working-directory: upstream-opendots
        run: |
          set -o pipefail
          npx vitest run tests/boss_cross_policy_spike.test.ts 2>&1 | tee ../boss_cross_policy_spike_log.txt
      - name: Preserve synthetic cross-policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-opendots-openbot-policy-spike
          path: boss_cross_policy_spike_log.txt
          if-no-files-found: ignore
          retention-days: 7
