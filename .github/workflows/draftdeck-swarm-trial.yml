name: BOSS Swarm Control Plane Trial
on:
  workflow_dispatch:
  push:
    branches: [feature/book-to-skills-intake-candidate]
    paths:
      - 'experiments/boss-agent-swarm-001/**'
      - '.github/workflows/draftdeck-swarm-trial.yml'
permissions:
  contents: read
jobs:
  graph-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/boss-agent-swarm-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run demo
