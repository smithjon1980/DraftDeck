name: BOSS Hugging Face Source Acquisition Test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acquire public Whisper fixture and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, urllib.error, datetime
          repo = "openai/whisper-tiny"
          base = f"https://huggingface.co/api/models/{repo}"
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"BOSS-source-acq-test/1.0"}),timeout=30) as resp:
                  return resp.read()
          meta = json.loads(get(base))
          revision = meta.get("sha")
          if not revision or len(revision)!=40 or any(c not in "0123456789abcdef" for c in revision.lower()):
              raise RuntimeError("Immutable upstream commit unavailable")
          url = f"https://huggingface.co/{repo}/resolve/{revision}/config.json"
          raw = get(url)
          obj = json.loads(raw)
          if not isinstance(obj,dict) or obj.get("model_type")!="whisper":
              raise RuntimeError("Unexpected Whisper configuration schema")
          p = pathlib.Path("package")
          (p/"config.json").write_bytes(raw)
          digest=hashlib.sha256(raw).hexdigest()
          (p/"SHA256SUMS.txt").write_text(f"{digest}  config.json\n")
          manifest={
              "order_id":"BOSS-SOURCE-ACQ-001",
              "status":"ACQUIRED_UNVERIFIED",
              "source_repository":repo,
              "source_revision":revision,
              "source_url":url,
              "source_filename":"config.json",
              "sha256":digest,
              "json_model_type":obj.get("model_type"),
              "acquired_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "runtime_test":"NOT_EXECUTED",
              "release_status":"HOLD"
          }
          (p/"manifest.json").write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          print(f"Upstream revision: {revision}")
          print(f"Fixture sha256: {digest}")
          print(f"JSON model_type: {obj.get('model_type')}")
          PY
      - name: Package acquired files
        shell: bash
        run: |
          set -euo pipefail
          cd package
          zip -q ../whisper-config-test.zip config.json SHA256SUMS.txt manifest.json
          unzip -t ../whisper-config-test.zip
      - name: Upload quarantined artifact
        uses: actions/upload-artifact@v4
        with:
          name: boss-whisper-config-test
          path: whisper-config-test.zip
          retention-days: 7
          if-no-files-found: error
