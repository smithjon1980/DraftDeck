name: BOSS gateway hardening transport boundary
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/boss-gateway-hardening/**'
      - '.github/workflows/boss-gateway-hardening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: 'true'
      DO_NOT_TRACK: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch pinned OpenDots upstream
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 https://github.com/CopilotKit/OpenDots.git upstream-opendots
          cd upstream-opendots
          git fetch --filter=blob:none --depth=1 origin 8091324942b86789ed0da7facbee855145d933b0
          git checkout --detach 8091324942b86789ed0da7facbee855145d933b0
          test "$(git rev-parse HEAD)" = 8091324942b86789ed0da7facbee855145d933b0
      - name: Install dependencies without lifecycle scripts
        working-directory: upstream-opendots
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund cel-js@0.8.2
      - name: Pin original OpenBot policy module
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/CopilotKit/OpenBot/bd4dc94943a9d62aefd05e5e99073ba58919c9c6/server/src/computer/policy.ts -o upstream-opendots/tests/boss-openbot-policy.ts
          test "$(git hash-object upstream-opendots/tests/boss-openbot-policy.ts)" = 94bc46ad3a74bdb56ad84f86527057ecba6c735e
          cp experiments/boss-gateway-hardening/gateway_hardening.test.ts upstream-opendots/tests/gateway_hardening.test.ts
      - name: Run gateway bypass and authorization tests
        working-directory: upstream-opendots
        run: |
          set -o pipefail
          npx vitest run tests/gateway_hardening.test.ts --maxWorkers=2 2>&1 | tee ../gateway-hardening-results.log
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-gateway-hardening-evidence
          path: gateway-hardening-results.log
          if-no-files-found: ignore
          retention-days: 7
