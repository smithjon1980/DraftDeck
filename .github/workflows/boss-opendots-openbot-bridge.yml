name: BOSS OpenDots + OpenBot direct policy-bridge qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/opendots-openbot-bridge/**'
      - '.github/workflows/boss-opendots-openbot-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated_bridge:
    name: Actual OpenDots service to original OpenBot policy+approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      DO_NOT_TRACK: '1'
      NODE_ENV: test
      WEB_SEARCH_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Clone exact upstream OpenDots source (synthetic test only)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 https://github.com/CopilotKit/OpenDots.git upstream-opendots
          cd upstream-opendots
          git fetch --filter=blob:none --depth=1 origin 8091324942b86789ed0da7facbee855145d933b0
          git checkout --detach 8091324942b86789ed0da7facbee855145d933b0
          test "$(git rev-parse HEAD)" = 8091324942b86789ed0da7facbee855145d933b0
      - name: Install pinned OpenDots dependencies and OpenBot CEL runtime
        working-directory: upstream-opendots
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund cel-js@0.8.2
      - name: Copy and hash-verify exact upstream OpenBot modules
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/CopilotKit/OpenBot/bd4dc94943a9d62aefd05e5e99073ba58919c9c6/server/src/computer/policy.ts" -o upstream-opendots/tests/boss-openbot-policy.ts
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/CopilotKit/OpenBot/bd4dc94943a9d62aefd05e5e99073ba58919c9c6/server/src/approvals/policy.ts" -o upstream-opendots/tests/boss-openbot-approvals.ts
          test "$(git hash-object upstream-opendots/tests/boss-openbot-policy.ts)" = 94bc46ad3a74bdb56ad84f86527057ecba6c735e
          test "$(git hash-object upstream-opendots/tests/boss-openbot-approvals.ts)" = 56606eeda7f58fbac7f9ba29806c31c4e4118314
          echo "OPENBOT_POLICY_AND_APPROVAL_SOURCE_HASHES_VERIFIED"
      - name: Inject synthetic integration test into throwaway checkout
        run: cp experiments/opendots-openbot-bridge/boss_bridge_integration.test.ts upstream-opendots/tests/boss_bridge_integration.test.ts
      - name: Run integrated OpenDots to OpenBot boundary and approval probes
        working-directory: upstream-opendots
        shell: bash
        run: |
          set -o pipefail
          npx vitest run tests/boss_bridge_integration.test.ts \
            --maxWorkers=2 2>&1 | tee ../boss_bridge_integration_results.log
      - name: Archive isolated output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-opendots-openbot-integration-evidence
          path: boss_bridge_integration_results.log
          if-no-files-found: ignore
          retention-days: 7
