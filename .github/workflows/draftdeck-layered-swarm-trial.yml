name: BOSS Layered Swarm Trial
on:
  workflow_dispatch:
  push:
    branches: [feature/book-to-skills-intake-candidate]
    paths:
      - 'experiments/boss-agent-swarm-001/**'
      - '.github/workflows/draftdeck-layered-swarm-trial.yml'
permissions:
  contents: read
jobs:
  layered-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/boss-agent-swarm-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node src/layered-cli.mjs
      - name: Validate independent layer outputs
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path("output/layered-trial-001")
          result=json.loads((root/"run-result.json").read_text())
          assert result["status"]=="AWAITING_HUMAN_VISUAL_REVIEW"
          assert result["events"]==["SUPERVISOR_ACCEPTED_FIXTURE","STORY_WORKER","ART_WORKER","TEXT_WORKER","CHROMIUM_PDF_BUILT","INDEPENDENT_STRUCTURAL_CHECK"]
          assert (root/"overview-layered.pdf").read_bytes()[:5]==b"%PDF-"
          assert json.loads((root/"qa.json").read_text())["visual_fidelity"]=="NOT_ESTABLISHED"
          print("LAYERED CONTRACT PASS — VISUAL ACCEPTANCE PENDING")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: boss-layered-swarm-001
          path: experiments/boss-agent-swarm-001/output/layered-trial-001/
          retention-days: 7
