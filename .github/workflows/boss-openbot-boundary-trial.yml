name: BOSS OpenBot governance pilot (isolated)
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/openbot-boundary-trial/**'
      - '.github/workflows/boss-openbot-boundary-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: experiments/openbot-boundary-trial
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Fetch exact OpenBot policy sources and verify their Git blobs
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=bd4dc94943a9d62aefd05e5e99073ba58919c9c6
          mkdir -p upstream/server/src/computer upstream/server/src/approvals
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/CopilotKit/OpenBot/${COMMIT}/server/src/computer/policy.ts" -o upstream/server/src/computer/policy.ts
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/CopilotKit/OpenBot/${COMMIT}/server/src/approvals/policy.ts" -o upstream/server/src/approvals/policy.ts
          echo "94bc46ad3a74bdb56ad84f86527057ecba6c735e" > expected-computer.sha
          echo "56606eeda7f58fbac7f9ba29806c31c4e4118314" > expected-approvals.sha
          test "$(git hash-object upstream/server/src/computer/policy.ts)" = "$(cat expected-computer.sha)"
          test "$(git hash-object upstream/server/src/approvals/policy.ts)" = "$(cat expected-approvals.sha)"
          echo "EXACT_UPSTREAM_OPENBOT_BLOBS_MATCH"
      - name: Install minimal dependencies for actual upstream functions
        run: bun install --no-save
      - name: Execute BOSS synthetic policy and approval decisions
        run: bun run test:policy
      - name: Upload decision test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-openbot-governance-policy-evidence
          path: experiments/openbot-boundary-trial/openbot_governance_results.json
          if-no-files-found: ignore
          retention-days: 7

  upstream_gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Clone exact OpenBot source in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 https://github.com/CopilotKit/OpenBot.git upstream-openbot
          cd upstream-openbot
          git fetch --filter=blob:none --depth=1 origin bd4dc94943a9d62aefd05e5e99073ba58919c9c6
          git checkout --detach bd4dc94943a9d62aefd05e5e99073ba58919c9c6
          test "$(git rev-parse HEAD)" = bd4dc94943a9d62aefd05e5e99073ba58919c9c6
          echo EXACT_UPSTREAM_GATEWAY_COMMIT_VERIFIED
      - name: Install original OpenBot workspace dependencies
        working-directory: upstream-openbot
        run: bun install --frozen-lockfile
      - name: Run OpenBot's own gateway and approval-policy tests
        working-directory: upstream-openbot
        run: |
          bun test server/tests/computer-gateway.test.ts server/tests/approvals-policy.test.ts
      - name: Report limits
        run: echo "Only original OpenBot gateway tests with mocked computer and audit store executed; no live database or deployment."
