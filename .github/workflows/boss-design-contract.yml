name: BOSS design contract (candidate)
on:
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'design-system/**'
      - 'tools/visual-poc/check_evidence_manifest.py'
      - 'tests/test_evidence_manifest.py'
      - 'doctrine/composition-standard.md'
      - 'doctrine/release-qa.md'
      - 'doctrine/visual-evidence-gate.md'
      - 'skills/draftdeck/SKILL.md'
      - '.agents/skills/boss-*/**'
      - 'tools/visual-poc/check_story_layers.py'
      - 'tests/test_story_layers.py'
      - 'tests/test_current_case_doctrine.py'
      - 'tools/editorial-layout/check_editorial_manuscript.py'
      - 'tests/test_editorial_manuscript.py'
      - 'doctrine/main-street-copy-case-model.md'
      - 'tools/visual-poc/check_story_art_resolution.py'
      - 'tests/test_story_art_resolution.py'
      - 'episode01/reference/skill-updates/README.md'
      - '.github/workflows/boss-design-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate design contract and negative fixtures
        run: python3 design-system/validation/check_contract.py
      - name: Validate evidence gate fixtures
        run: python3 design-system/validation/test_visual_evidence.py
      - name: Validate visual evidence manifest negative fixtures
        run: python3 -m unittest discover -s tests -p 'test_evidence_manifest.py' -v
      - name: Validate story illustration integrity and creative handoff negative fixtures
        run: python3 -m unittest discover -s tests -p 'test_story_layers.py' -v
      - name: Validate browser-measured story artwork resolution negative fixtures
        run: python3 -m unittest discover -s tests -p 'test_story_art_resolution.py' -v
      - name: Validate current case and script-approval boundaries
        run: python3 -m unittest discover -s tests -p 'test_current_case_doctrine.py' -v
      - name: Validate manuscript-first editorial layout source hash negative fixtures
        run: python3 -m unittest discover -s tests -p 'test_editorial_manuscript.py' -v
      - name: Report limits
        run: echo "Only structural parity checked. Visual/adapters/human authorization remain unverified."
