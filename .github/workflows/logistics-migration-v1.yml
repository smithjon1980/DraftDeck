name: logistics-framework-migration-v1
on:
  push:
    branches: [refactor/logistics-framework-v1]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply logistics framework migration
        run: |
          set -euo pipefail

          git mv examples/ai-pilot examples/logistics-framework

          if [ -f examples/logistics-framework/verification/Canva_Verification.json ]; then
            git mv examples/logistics-framework/verification/Canva_Verification.json               examples/logistics-framework/verification/Canva_Baseline_Verification.json
          fi

          rm -rf examples/logistics-framework/previews
          rm -f examples/logistics-framework/artwork/story-03.png                 examples/logistics-framework/artwork/story-03.webp                 examples/logistics-framework/artwork/story-12.png                 examples/logistics-framework/artwork/story-12.webp                 examples/logistics-framework/artwork/Contact-1.png                 examples/logistics-framework/artwork/Contact-2.png                 examples/logistics-framework/artwork/Contact-3.png

          rm -rf archive/reference
          rm -f archive/Archive_Manifest.json

          rm -rf examples/logistics-framework/output/*
          python3 examples/logistics-framework/source/Build_Deck.py

          rm .github/workflows/logistics-migration-v1.yml
          git add -A

          if git ls-files | grep -Eiq 'ai[-_]?pilot|(^|[/_.-])pilot([/_.-]|$)|flight|airspace'; then
            echo "Deprecated terminology remains in tracked filenames:"
            git ls-files | grep -Ei 'ai[-_]?pilot|(^|[/_.-])pilot([/_.-]|$)|flight|airspace'
            exit 1
          fi

          if git grep -n -I -E 'AI[ _-]?Pilot|FAA|AIRSPACE_CLASS|FLIGHT_PLAN_ID|Client Tower|flight-manual|air traffic' -- .; then
            echo "Deprecated terminology remains in tracked text."
            exit 1
          fi

          test -f examples/logistics-framework/output/Logistics_Framework_15_Slides_Layered.html
          test -f examples/logistics-framework/output/Scenes.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: complete logistics framework migration"
          git push
