name: logistics-framework-migration-v1
on:
  push:
    branches: [refactor/logistics-framework-v1]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply logistics framework migration
        run: |
          set -euo pipefail

          mkdir -p examples/logistics-framework/artwork

          # Preserve only still-used neutral source assets from the predecessor folder.
          if [ -d examples/ai-pilot/artwork ]; then
            for f in story-05.png story-05.webp s13-Story_Layer.png s13-Story_Layer.webp s13-Drafting_Background.svg; do
              if [ -f "examples/ai-pilot/artwork/$f" ] && [ ! -f "examples/logistics-framework/artwork/$f" ]; then
                git mv "examples/ai-pilot/artwork/$f" "examples/logistics-framework/artwork/$f"
              fi
            done
          fi

          # Remove the retired predecessor tree.
          if [ -d examples/ai-pilot ]; then
            git rm -rq examples/ai-pilot
          fi

          rm -rf examples/logistics-framework/previews
          rm -f examples/logistics-framework/artwork/story-03.png examples/logistics-framework/artwork/story-03.webp examples/logistics-framework/artwork/story-06.png examples/logistics-framework/artwork/story-06.webp examples/logistics-framework/artwork/story-12.png examples/logistics-framework/artwork/story-12.webp examples/logistics-framework/artwork/Contact-1.png examples/logistics-framework/artwork/Contact-2.png examples/logistics-framework/artwork/Contact-3.png

          rm -rf archive/reference
          rm -f archive/Archive_Manifest.json

          rm -rf examples/logistics-framework/output
          mkdir -p examples/logistics-framework/output
          python3 examples/logistics-framework/source/Build_Deck.py

          git add -A

          # Filename gate: no aviation-era names in tracked paths.
          if git ls-files | grep -Eiq 'ai[-_]?pilot|(^|[/_.-])pilot([/_.-]|$)|flight|airspace'; then
            echo "Deprecated terminology remains in tracked filenames:"
            git ls-files | grep -Ei 'ai[-_]?pilot|(^|[/_.-])pilot([/_.-]|$)|flight|airspace'
            exit 1
          fi

          # Content gate. Single tokens use word boundaries so base64 image
          # payloads in generated HTML cannot false-positive. Excluded: this
          # workflow (contains the pattern itself) and the doctrine file that
          # defines the prose prohibition list.
          PAT='AI[ _-]?Pilot|\bFAA\b|\bAIRSPACE_CLASS\b|\bFLIGHT_PLAN_ID\b|Client Tower|flight-manual|air traffic|\bcockpit\b|\brunway\b|\baircraft\b'
          if git grep -n -I -Ei "$PAT" -- . ':(exclude).github' ':(exclude)doctrine/logistics-framework.md'; then
            echo "Deprecated aviation-era terminology remains in tracked text."
            exit 1
          fi

          test -f examples/logistics-framework/output/Logistics_Framework_15_Slides_Layered.html
          test -f examples/logistics-framework/output/Scenes.json

          rm .github/workflows/logistics-migration-v1.yml
          git add -A

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: complete logistics framework migration"
          git push
