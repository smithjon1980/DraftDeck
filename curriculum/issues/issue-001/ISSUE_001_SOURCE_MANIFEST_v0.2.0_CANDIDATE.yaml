  quality test that could detect failures before release.
competency_anchors:
  - id: C-01
    state: WORKING_RUBRIC_NOT_RATIFIED
    skill: Define the goal, one bounded constraint, a justified exclusion, and an exception path.
    assessment: Produce a four-field constraint card for a two-format lesson: goal, bounded rule, justified exclusion, exception path.
  - id: C-02
    state: WORKING_RUBRIC_NOT_RATIFIED
    skill: Name proposer, verifier, and final approving authority.
    assessment: Annotate the roles in the provided publication case.
  - id: C-03
    state: WORKING_RUBRIC_NOT_RATIFIED
    skill: Distinguish assertion, source, observation, and untested inference.
    assessment: Classify four sample assertions with evidence labels.
  - id: C-04
    state: WORKING_RUBRIC_NOT_RATIFIED
    skill: Describe a testable error, bounded correction, and re-verification.
    assessment: Specify a one-segment audio correction procedure.
  - id: C-05
    state: WORKING_RUBRIC_NOT_RATIFIED
    skill: Assemble a trace from source through prompt and decision to evidence.
    assessment: Provide a simple source-claim-output acceptance ledger.
  - id: C-06
    state: WORKING_RUBRIC_NOT_RATIFIED
    skill: Identify evidence that would falsify a claimed improvement.
    assessment: Propose a cost or quality comparison with confounders.
  - id: C-07
    state: WORKING_RUBRIC_NOT_RATIFIED
    skill: Transfer versioned information another reviewer can inspect.
    assessment: Assemble a portable decision packet with unresolved states.
